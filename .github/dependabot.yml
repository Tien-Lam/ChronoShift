version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Related Actions updates can share a complete verification gate.
    groups:
      actions-maintenance:
        applies-to: version-updates
        patterns: ["*"]

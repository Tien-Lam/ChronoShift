name: GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/design/**"
      - "docs/qa/**"
      - "experiments/**"
      - "docs/planning/ci-efficiency.json"
      - "docs/planning/offline-web-linear-map.json"
      - "docs/planning/*performance*.json"
  workflow_dispatch:
permissions:
  contents: read
# Serialize preparation and deployment together so a slower older fallback
# cannot publish after a newer reused artifact. Never cancel active deployment.
concurrency:
  group: pages-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    # Static artifact validation/publication needs no browser or Docker host.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    # Only trusted main source and the bounded verifier execute here. Extracted
    # artifact files are served as static content; never execute their code.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: bun gh
      - name: Reuse the exact verified PR artifact
        id: reuse
        if: github.event_name == 'push'
        run: bun scripts/reuse-pages-artifact.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.reuse.outputs.reused == 'true'
      - name: Upload the verified Pages build
        if: steps.reuse.outputs.reused == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 14
      - id: deployment
        if: steps.reuse.outputs.reused == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  verify:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.reused != 'true'
    permissions:
      contents: read
      pages: read
    uses: ./.github/workflows/web.yml
    with:
      publish-pages: true
  deploy:
    needs: [prepare, verify]
    # A failed reuse/upload/deployment must not start a second publication.
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.reused != 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: GitHub Pages
on:
  push:
    # The migration preview publishes from its verified PR workflow.
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/design/**"
      - "docs/planning/ci-efficiency.json"
      - "docs/planning/offline-web-linear-map.json"
      - "docs/planning/*performance*.json"
  workflow_dispatch:
permissions:
  contents: read
  # The called workflow also defines a conditional preview deployment job.
  pages: write
  id-token: write
jobs:
  verify:
    uses: ./.github/workflows/web.yml
    with:
      publish-pages: true
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

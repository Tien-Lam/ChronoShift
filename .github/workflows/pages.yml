name: GitHub Pages
on:
  push:
    # Publish the migration preview now; remove this branch after web cutover.
    branches: [main, codex/offline-web-migration]
    paths-ignore:
      - "**/*.md"
      - "docs/design/**"
      - "docs/planning/ci-efficiency.json"
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  verify:
    uses: ./.github/workflows/web.yml
    with:
      publish-pages: true
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

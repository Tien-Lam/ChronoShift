name: Web
on:
  workflow_call:
    inputs:
      publish-pages:
        description: Upload the verified repository-path build for deployment
        type: boolean
        default: false
      ci-timing:
        description: Record bounded browser timing for an investigation
        type: boolean
        default: false
  # Same-repository PRs retain their tested artifact for main-only publication.
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/design/**"
      - "docs/qa/**"
      - "experiments/**"
      - "docs/planning/ci-efficiency.json"
      - "docs/planning/offline-web-linear-map.json"
      - "docs/planning/*performance*.json"
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    container:
      # Playwright 1.63.0 / Ubuntu 24.04, pinned official multi-platform image.
      # Update this digest and the version guard with @playwright/test.
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # Match GitHub's mounted workspace/home owner; Firefox requires this.
      options: --user 1001:1001 --ipc=host --init
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_IMAGE_VERSION: "1.63.0"
      CHRONOSHIFT_CI_TIMING: ${{ (inputs.ci-timing || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-timing'))) && '1' || '0' }}
      PUBLISH_PAGES: ${{ inputs.publish-pages || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    concurrency:
      group: web-verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Capture the checked-in corpus audit
        run: cp -f docs/planning/corpus-audit.json "$RUNNER_TEMP/chronoshift-corpus-audit.json"
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: bun install --frozen-lockfile
      - name: Verify the pinned browser image matches the dependency
        run: >-
          bun -e 'const pkg = await Bun.file("node_modules/playwright/package.json").json();
          if (pkg.version !== process.env.PLAYWRIGHT_IMAGE_VERSION)
          throw new Error("Update the pinned Playwright image and version guard with the dependency");
          const { chromium, firefox, webkit } = await import("@playwright/test");
          for (const browser of [chromium, firefox, webkit])
          if (!(await Bun.file(browser.executablePath()).exists()))
          throw new Error("The pinned image is missing " + browser.name());'
      - run: bun run format:check
      - name: Unit tests and production build
        run: |
          bun run test
          bun run build
      - name: Verify the standalone conversion corpus audit
        run: |
          bun run corpus:audit
          diff -u "$RUNNER_TEMP/chronoshift-corpus-audit.json" docs/planning/corpus-audit.json
      - name: Run bun run test:browser
        run: |
          bun scripts/ci-environment.ts before
          bun run test:browser
      - name: Record browser resource usage
        if: ${{ !cancelled() }}
        run: bun scripts/ci-environment.ts after
      - name: Retain bounded browser timing metadata
        if: ${{ !cancelled() && env.CHRONOSHIFT_CI_TIMING == '1' && hashFiles('test-results/ci-timing.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chronoshift-ci-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ci-timing.json
          retention-days: 1
      - id: pages
        if: inputs.publish-pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Verify repository-subpath deployment
        run: |
          bun run build
          # Keep browser first-attempt evidence when the separate subpath
          # runner clears its own output before starting.
          bunx --bun playwright test --config=playwright.subpath.config.ts --output=test-results/subpath
        env:
          BASE_PATH: /ChronoShift/
      - name: Upload the verified Pages build
        if: env.PUBLISH_PAGES == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: ${{ inputs.publish-pages && 14 || 1 }}
      - name: Publish failed-attempt diagnostics
        if: ${{ !cancelled() && (failure() || hashFiles('test-results/attempt-failures.json') != '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chronoshift-web-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/planning/corpus-audit.json
            playwright-report/
            test-results/
          retention-days: 3

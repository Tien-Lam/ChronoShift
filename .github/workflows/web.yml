name: Web
on:
  workflow_call:
    inputs:
      publish-pages:
        description: Upload the verified repository-path build for deployment
        type: boolean
        default: false
  # Main publication calls this gate. PR #16 also publishes its tested preview
  # after proving the merge tree is identical to the migration branch.
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/design/**"
      - "docs/planning/ci-efficiency.json"
      - "docs/planning/offline-web-linear-map.json"
      - "docs/planning/*performance*.json"
permissions:
  contents: read
jobs:
  web:
    outputs:
      preview: ${{ steps.preview.outputs.publish }}
    runs-on: ubuntu-latest
    container:
      # Playwright 1.63.0 / Ubuntu 24.04, pinned official multi-platform image.
      # Update this digest and the version guard with @playwright/test.
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # Match GitHub's mounted workspace/home owner; Firefox requires this.
      options: --user 1001:1001 --ipc=host --init
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_IMAGE_VERSION: "1.63.0"
      PUBLISH_PAGES: ${{ inputs.publish-pages || (github.event_name == 'pull_request' && github.event.pull_request.number == 16 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/offline-web-migration') }}
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    concurrency:
      group: web-verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Capture the checked-in corpus audit
        run: cp -f docs/planning/corpus-audit.json "$RUNNER_TEMP/chronoshift-corpus-audit.json"
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: bun install --frozen-lockfile
      - name: Verify preview matches the publishing branch
        id: preview
        if: github.event_name == 'pull_request' && env.PUBLISH_PAGES == 'true'
        env:
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$PREVIEW_HEAD_SHA"
          bun scripts/verify-preview-tree.ts "$PREVIEW_HEAD_SHA"
          git checkout --detach "$PREVIEW_HEAD_SHA"
          echo "CHRONOSHIFT_SOURCE_COMMIT=$PREVIEW_HEAD_SHA" >> "$GITHUB_ENV"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Verify the pinned browser image matches the dependency
        run: >-
          bun -e 'const pkg = await Bun.file("node_modules/playwright/package.json").json();
          if (pkg.version !== process.env.PLAYWRIGHT_IMAGE_VERSION)
          throw new Error("Update the pinned Playwright image and version guard with the dependency");
          const { chromium, firefox, webkit } = await import("@playwright/test");
          for (const browser of [chromium, firefox, webkit])
          if (!(await Bun.file(browser.executablePath()).exists()))
          throw new Error("The pinned image is missing " + browser.name());'
      - run: bun run format:check
      - name: Unit tests and production build
        run: |
          bun run test
          bun run build
      - name: Verify the standalone conversion corpus audit
        run: |
          bun run corpus:audit
          diff -u "$RUNNER_TEMP/chronoshift-corpus-audit.json" docs/planning/corpus-audit.json
      - run: bun run test:browser
      - id: pages
        if: env.PUBLISH_PAGES == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Verify repository-subpath deployment
        run: |
          bun run build
          bunx --bun playwright test --config=playwright.subpath.config.ts
        env:
          BASE_PATH: ${{ env.PUBLISH_PAGES == 'true' && format('{0}/', steps.pages.outputs.base_path) || '/ChronoShift/' }}
      - name: Upload the verified Pages build
        if: env.PUBLISH_PAGES == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 14
      - name: Publish failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chronoshift-web-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/planning/corpus-audit.json
            playwright-report/
            test-results/
          retention-days: 3
  deploy-preview:
    if: github.event_name == 'pull_request' && needs.web.outputs.preview == 'true'
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
